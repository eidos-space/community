name: Validate

on:
  pull_request:
    paths:
      - '*.registry.json'
      - 'schemas/**'
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g ajv-cli
      - run: ajv validate -s schemas/themes.schema.json -d themes.registry.json
      - run: ajv validate -s schemas/extensions.schema.json -d extensions.registry.json
      - run: ajv validate -s schemas/plugins.schema.json -d plugins.registry.json
